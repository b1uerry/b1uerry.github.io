# NexT 主题配置（覆盖 node_modules/hexo-theme-next/_config.yml 中的默认值）
# 完整选项见: https://theme-next.js.org/docs/theme-settings/

# Schemes: Muse | Mist | Pisces | Gemini
scheme: Gemini

# 深色模式：生成深色配色（通过 data-theme 手动切换，见 source/_data/ 下的自定义文件）
darkmode: true

menu:
  home: / || fa fa-home
  about: /about/ || fa fa-user
  tags: /tags/ || fa fa-tags
  categories: /categories/ || fa fa-th
  archives: /archives/ || fa fa-archive

menu_settings:
  icons: true
  badges: false

sidebar:
  position: left
  display: post
  padding: 18
  offset: 12

# 文章目录（标题里已自带编号，这里关闭自动编号，避免出现 "1.1 1.1"）
toc:
  enable: true
  number: false
  wrap: false
  expand_all: false
  max_depth: 6

post_meta:
  created_at: true
  updated_at:
    enable: true
    another_day: true
  categories: true

# 图片点击放大
fancybox: true

codeblock:
  copy_button:
    enable: true

# 数学公式（MathJax）
math:
  every_page: true
  mathjax:
    enable: true
    tags: ams
    display_overflow: scroll

# 本地搜索（依赖 hexo-generator-searchdb）
local_search:
  enable: true
  trigger: auto
  top_n_per_article: 1
  unescape: false
  preload: false

# 第三方静态资源全部自托管（不依赖 cdnjs / jsDelivr，国内访问更稳）
vendors:
  internal: local
  plugins: local

back2top:
  enable: true
  sidebar: false
  scrollpercent: true

post_navigation: true

footer:
  since: 2023
  icon:
    name: fa fa-heart
    animated: false
    color: "#ff6b6b"
  copyright: b1uerry
  powered: true

# ---------------------------------------------------------------
# 自定义文件（NexT Custom Files）
# ---------------------------------------------------------------
custom_file_path:
  head: source/_data/head.njk
  bodyEnd: source/_data/body-end.njk
  postBodyEnd: source/_data/post-body-end.njk
  style: source/_data/styles.styl

# ---------------------------------------------------------------
# 评论：Giscus
# https://giscus.app
# 前置条件：
#   1. 仓库 Settings → General → Features 勾选 Discussions
#   2. 安装 giscus App: https://github.com/apps/giscus
#   3. 打开 https://giscus.app，填入仓库，选择 Discussions 分类，
#      把生成的 data-category-id 粘贴到下面 category_id
# ---------------------------------------------------------------
giscus:
  enable: true
  repo: b1uerry/b1uerry.github.io
  repo_id: R_kgDOJO0zrA
  category: Announcements
  category_id: DIC_kwDOJO0zrM4DLHao
  mapping: pathname
  input_position: bottom
  lang: zh-CN
  theme_light: light
  theme_dark: dark

# ---------------------------------------------------------------
# 访问统计（填了 ID 才生效，可只选一个）
# ---------------------------------------------------------------

# Google Analytics 4
# 到 https://analytics.google.com 创建媒体资源，拿到 G-XXXXXXX
google_analytics:
  tracking_id: "" # 例如 G-XXXXXXXXXX
  only_pageview: false

# Umami（自建或 Umami Cloud）
# 自建：script_url 填 https://你的域名/script.js，website_id 在后台 Website Settings 里
umami:
  enable: false
  script_url: "" # https://umami.example.com/script.js
  website_id: "" # xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
  host_url: ""
